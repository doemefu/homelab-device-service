apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: apps
  labels:
    app: device-service
spec:
  replicas: 1
  # replicas must stay 1 and a rollout must not surge: a second pod connects with the same MQTT
  # client id (the broker drops the other session, both auto-reconnect and take the session from
  # each other every ~2.6 s until the old pod exits) and runs a second scheduler (#67).
  # maxSurge 0 starts terminating the old pod before the replacement is created. This avoids the
  # overlap in practice (the old pod drops MQTT within ms of SIGTERM, the new one connects ~20 s
  # after start) but is no exclusivity guarantee: Kubernetes does not wait for the old process
  # to exit. Cost: the startup time is downtime on every rollout. Not `type: Recreate`: Flux's
  # server-side apply keeps the defaulted rollingUpdate block, and the API server rejects it
  # together with Recreate.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: device-service
  template:
    metadata:
      labels:
        app: device-service
    spec:
      automountServiceAccountToken: false
      # Numeric ids are required for runAsNonRoot: the image's USER is the name `appuser`, which
      # kubelet cannot verify as non-root. 100/101 are what `adduser -S appuser -G appgroup` assigns
      # on the pinned alpine base image; re-check them when the base image changes (#85).
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-service
          # Image tag is managed by Flux CD image automation.
          image: ghcr.io/doemefu/homelab-device-service:main-20261103T074643 # {"$imagepolicy": "flux-system:device-service"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /tmp is the only path the JVM writes at runtime (Tomcat work dir, java.io.tmpdir).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8081
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: db-password
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: mqtt-password
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: influx-token
            - name: DB_URL
              value: "jdbc:postgresql://postgresql.apps.svc.cluster.local:5432/homelabdb"
            - name: MQTT_BROKER_URL
              value: "tcp://mosquitto.apps.svc.cluster.local:1883"
            - name: INFLUX_URL
              value: "http://influxdb2.apps.svc.cluster.local:80"
            - name: JWKS_URI
              value: "http://auth-service.apps.svc.cluster.local:8080/oauth2/jwks"
            - name: AUTH_SERVICE_BASE_URL
              value: "http://auth-service.apps.svc.cluster.local:8080"
            - name: DEVICE_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: device-service-client-secret
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry-dsn
                  key: dsn
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: "production"
          # 60 x 5 s = 300 s startup budget: Spring Boot start takes 65-95 s at 1 CPU on mba1 and >150 s at 0.5 CPU on the 4-core node; keep >= 2x margin (see #60).
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: apps
spec:
  selector:
    app: device-service
  ports:
    - port: 8081
      targetPort: 8081
