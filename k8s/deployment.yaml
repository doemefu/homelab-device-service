apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: apps
  labels:
    app: device-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-service
  template:
    metadata:
      labels:
        app: device-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: device-service
          # Image tag is managed by Flux CD image automation.
          image: ghcr.io/doemefu/homelab-device-service:main-20260831T054014 # {"$imagepolicy": "flux-system:device-service"}
          ports:
            - containerPort: 8081
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: db-password
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: mqtt-password
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: influx-token
            - name: DB_URL
              value: "jdbc:postgresql://postgresql.apps.svc.cluster.local:5432/homelabdb"
            - name: MQTT_BROKER_URL
              value: "tcp://mosquitto.apps.svc.cluster.local:1883"
            - name: INFLUX_URL
              value: "http://influxdb2.apps.svc.cluster.local:80"
            - name: JWKS_URI
              value: "http://auth-service.apps.svc.cluster.local:8080/oauth2/jwks"
            - name: DEVICE_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: device-service-secrets
                  key: device-service-client-secret
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry-dsn
                  key: dsn
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: "production"
          # 60 x 5 s = 300 s startup budget: Spring Boot start takes 65-95 s at 1 CPU on mba1 and >150 s at 0.5 CPU on the 4-core node; keep >= 2x margin (see #60).
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: apps
spec:
  selector:
    app: device-service
  ports:
    - port: 8081
      targetPort: 8081
