spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_schema_history_device

  # Override OAuth2 client provider to avoid OIDC discovery HTTP call at startup in tests
  security:
    oauth2:
      resourceserver:
        jwt:
          # As in production (#81). The dummy jwk-set-uri keeps Boot off the issuer-discovery
          # decoder, so a test that neither mocks JwtDecoder nor sets a JWKS fails instead of
          # calling the real auth-service. Tests with a real decoder override it.
          jwk-set-uri: http://127.0.0.1:1/oauth2/jwks
          issuer-uri: https://auth.furchert.ch
      client:
        registration:
          device-service:
            provider: auth-service
            client-id: device-service
            client-secret: ${DEVICE_SERVICE_CLIENT_SECRET:test}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/device-service"
            scope: openid,profile,email
        provider:
          auth-service:
            authorization-uri: http://localhost/oauth2/authorize
            token-uri: http://localhost/oauth2/token
            jwk-set-uri: http://localhost/oauth2/jwks
            user-info-uri: http://localhost/userinfo
            user-name-attribute: sub

sentry:
  enabled: false
  dsn:

app:
  mqtt:
    client-id: device-service-test
    topics: terra1/#,terra2/#,terraGeneral/#
    qos: 1
    will-topic: javaBackend/mqtt/status
    will-payload: '{"MqttState": 0}'
  scheduler:
    poll-interval: 60000
